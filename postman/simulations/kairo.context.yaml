purpose:
  stands_in_for: Firebase Authentication and Firestore REST plus the private Kairo R2 Worker.
  unblocks: Repeatable local client contract checks without production accounts or objects, on hosts allowing listening ports.
assumptions:
  - id: firebase-authentication-tokens
    status: supported
    claim: The configured production Firebase project accepts email/password registration and login and returns tokens usable for refresh and account lookup.
    reason: The user ran all disposable-account live verification checks successfully against the configured deployment.
    verification: On 2026-10-31 the live report passed signup, sign-in, refresh, lookup and cleanup. Earlier local contract doubles only supported client serialization; they did not establish production behavior.
    source: test-results/cloud-verification.json; src/lib/cloud-verification.js; tests/cloud.test.js; docs/API_CONTRACT.md
    updated_at: "2026-10-31"
  - id: firestore-preconditions-and-owner-rules
    status: supported
    claim: The deployed project accepts private record writes and optimistic preconditions and denies anonymous, cross-account and invalid-schema requests in the verified cases.
    reason: Live checks passed after the user uploaded the supplied Firestore rules.
    verification: On 2026-10-31 all owner/schema/precondition checks passed. Server timestamp and incremental-query serialization also have local contract coverage; the stand-in is not independent evidence of every Firebase guarantee.
    source: test-results/cloud-verification.json; firestore.rules; tests/cloud.test.js; docs/API_CONTRACT.md
    updated_at: "2026-10-31"
  - id: r2-private-prefix
    status: supported
    claim: The deployed kairo-chat Worker denies unauthenticated and cross-account object access while allowing owner upload, metadata, download, encrypted restore and cleanup.
    reason: The verified deployment binds the user's private bucket and Firebase project, with all 20 live checks passing.
    verification: On 2026-10-31 the user ran full production verification. Earlier stand-in tokens only modeled identity and did not prove real signature validity; local Worker tests separately verify RS256 JWT validation and bounded body handling.
    source: test-results/cloud-verification.json; cloudflare/worker.mjs; tests/worker.test.js; docs/API_CONTRACT.md
    updated_at: "2026-10-31"
  - id: configuration-and-ai-credentials
    status: supported
    claim: Cloud configuration can be saved per installation through the backend setup screen, with optional environment configuration, while AI configuration remains in native Claude settings.json or Codex config.toml without direct OpenAI API calls.
    reason: Configuration persistence tests and packaged-startup integration tests exercise local backend setup, restart restoration, native file precedence and cloud credential isolation.
    verification: Configuration/subprocess tests pass. The original context's claim that provider credentials came from application environment variables is historical and was superseded by the user's native CLI requirement. The user confirmed a Codex live response. Claude normal-mode verification detected authentication but timed out at 60 seconds on 2026-10-31. A local safe-mode attempt reached the request phase and timed out at 10 seconds in the network-restricted workspace; that result does not establish whether the user’s gateway is available. The user subsequently ran safe mode for 120 seconds; it also timed out during the request. The user then deferred Claude and chose Codex only for now. KAIRO_ACTIVE_PROVIDER=codex restricts this device’s runtime view and dispatch without changing native credentials or saved history. Live Claude remains deferred until the user returns to it. On 2026-11-01 local configuration and Electron tests verified a packaged startup with no environment file, in-app backend save, login against contract doubles, restart restoration and a second login. Storage tests exercised encryption hooks, rejection of plaintext backup passphrases and invalid Worker URLs. These results do not establish native keychain behavior or new live-service verification.
    source: src/lib/cloud-settings.js; src/main.js; tests/main.test.js; src/lib/env.js; src/lib/providers.js; tests/configuration.test.js; tests/providers.test.js; docs/USER_CHECKS.md
    updated_at: "2026-11-01"
  - id: simulation-execution
    status: unknown
    claim: The Postman simulation serves the real client requests with the expected response and state behavior on a host permitting listening sockets.
    reason: This workspace prohibits local listening ports, so no Postman server run established interception or request outcomes.
    verification: On 2026-11-01 Postman CLI 1.75.0 simulation startup again failed with listen EPERM on 127.0.0.1 before it could intercept any requests. Earlier simulation startup also failed with EPERM. In-process doubles exercise client contracts, but do not constitute a successful Postman simulation. Official provider documentation could not be fetched here because DNS is restricted; live checks now support the deployment cases listed above. Run the simulation on an unrestricted host to settle this claim.
    source: postman/simulations/kairo.sim.yaml; postman/mocks/firebase/default.js; postman/mocks/r2/default.js; tests/cloud.test.js
    updated_at: "2026-11-01"
  - id: node-cli-launch-environment
    status: supported
    claim: In the tested macOS installation, Kairo can start the installed Node-based Codex CLI with a Finder-style minimal PATH by supplementing executable search paths.
    reason: A direct version check failed with the reported missing-node error while the same installed executable succeeded through Kairo with the same input PATH.
    verification: On 2026-11-01 direct launch with PATH=/usr/bin:/bin exited 127 with env node not found. Kairo runFile returned exit 0 and codex-cli 0.166.0. Fixture tests also covered CLI health and chat subprocesses, nvm discovery and actionable missing-Node errors; all 83 local tests passed. No live model request, native Finder launch or Windows installation was verified by these checks. The HTTP dependency contracts were unchanged, so the earlier Postman simulation limitation remains applicable.
    source: src/lib/process-path.js; src/lib/providers.js; tests/providers.test.js; docs/TROUBLESHOOTING.md
    updated_at: "2026-11-01"

